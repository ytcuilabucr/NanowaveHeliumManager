[project]
name = "nanowave-heliummanager"
version = "0.1.0"
description = "Helium recovery system monitoring and control console"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "nicegui>=3.18.0",
    "pydantic>=2.14.0",
    "pywebview>=6.2.1",
    "tinytuya>=1.20.0",
]

[project.scripts]
heliumrecovery = "heliumrecovery.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heliumrecovery"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
